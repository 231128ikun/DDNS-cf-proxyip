name: CI

# 校验模块源码和测试；部署入口是 wrangler.toml 指向的 app/src/index.ts，仓库不提交构建产物。
on:
  push:
    paths:
      - 'app/**'
      - 'wrangler.toml'
      - 'AGENTS.md'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'wrangler.toml'
      - 'AGENTS.md'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: typecheck / test / build / size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run check`：类型检查、单元测试、构建前端与 Worker、体积门禁。
      # 面板由 Cloudflare 静态资源分发，Worker 只处理 /api/*；全部用例使用内存 KV 与 mock fetch。
      - name: Check
        run: npm run check

      # 冒烟检查本地起一个 Worker，确认静态资源与 /api/* 的分工没有被改坏。
      - name: Deployment shape smoke check
        run: npm run smoke

      # 部署入口是源码，仓库里不应再出现构建产物。
      - name: Reject committed build artifacts
        working-directory: .
        run: |
          if git ls-files --error-unmatch _worker.js >/dev/null 2>&1; then
            echo "_worker.js 不应提交：部署入口是 app/src/index.ts"
            exit 1
          fi