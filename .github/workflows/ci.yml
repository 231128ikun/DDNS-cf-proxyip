name: CI

on:
  push:
    branches: [beta, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: ${{ github.event_name == 'push' && github.ref_name == 'beta' && 'beta / check' || 'typecheck / test / build / size / deployment shape' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'app/.node-version'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check
        run: npm run check

      - name: Deployment entry dry-run
        run: npm run deploy -- --dry-run

      - name: Desktop and mobile essential flows
        run: npm run audit:acceptance

      - name: Save UI comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review
          retention-days: 14
          path: app/.wrangler/tmp/ui-acceptance
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Reject committed ignored files
        working-directory: .
        run: |
          ignored="$(git ls-files --cached --ignored --exclude-standard)"
          if [ -n "$ignored" ]; then
            echo "以下文件命中 .gitignore，不应提交："
            printf '%s\n' "$ignored"
            exit 1
          fi
