name: CI

# Required checks run for every PR, including documentation-only changes.
on: [push, pull_request, workflow_dispatch]

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: typecheck / test / build / size / deployment shape
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'app/.node-version'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: UI accessibility regression and functional flows
        run: npm run audit:ui:regression && npm run audit:flows

      - name: Save UI comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review
          path: |
            app/.wrangler/tmp/ui-flows
            app/.wrangler/tmp/ui-audit
            app/.wrangler/tmp/ui-regression
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Reject committed ignored files
        working-directory: .
        run: |
          ignored="$(git ls-files --cached --ignored --exclude-standard)"
          if [ -n "$ignored" ]; then
            echo "以下文件命中 .gitignore，不应提交："
            printf '%s\n' "$ignored"
            exit 1
          fi
