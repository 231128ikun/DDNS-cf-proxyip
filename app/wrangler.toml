name = "ddns-cf-proxyip"
main = "src/index.ts"
compatibility_date = "2026-09-24"
minify = true

[alias]
crypto = "./src/adapters/probe/web-crypto.ts"

[build]
command = "node scripts/build-worker.mjs"
watch_dir = ["src", "web", "scripts"]

# API requests run in the Worker; other paths use static assets.
[assets]
directory = "dist/web"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*"]

# Reuse the target Worker's IP_DATA binding; otherwise provision a namespace.
[[kv_namespaces]]
binding = "IP_DATA"

[triggers]
crons = ["0 */3 * * *"]
