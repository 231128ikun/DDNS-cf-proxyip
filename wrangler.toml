# 源码即入口：Wrangler 直接打包 app/src/index.ts，仓库不提交任何构建产物。
name = "ddns-pro-refactor"
main = "app/src/index.ts"
compatibility_date = "2026-09-24"

# 面板是 Cloudflare 静态资源，由边缘直接分发；Worker 只处理 /api/*。
# 构建命令：cd app && npm ci && npm run build
# not_found_handling 用 none：缺失的 JS/CSS 必须 404，不能被兜底成 200 HTML。
[assets]
directory = "app/dist/web"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*"]

# 创建/绑定 KV 后，代码中的变量名必须保持为 IP_DATA。
# 如果已有 Namespace，请补上 id 并删除下面占位绑定。
[[kv_namespaces]]
binding = "IP_DATA"

# 可选环境变量只是首次启动默认值；面板保存后以 KV 的 app_config 为准。
[vars]
CHECK_API = ""
CHECK_API_BACKUP = ""
CHECK_TIMEOUT = "15000"

# 每 3 小时检查一次；面板关闭 scheduledEnabled 时任务会直接跳过。
[triggers]
crons = ["0 */3 * * *"]
