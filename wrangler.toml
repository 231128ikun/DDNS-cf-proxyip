# 当前部署入口：保持原始、可直接阅读和手动复制的 `_worker.js`。
name = "ddns-cf-proxyip"
main = "_worker.js"
compatibility_date = "2026-09-24"

# 创建/绑定 KV 后，代码中的变量名必须保持为 IP_DATA。
# 如果已有 Namespace，请补上 id 并删除下面占位绑定。
[[kv_namespaces]]
binding = "IP_DATA"

# 可选环境变量只是首次启动默认值；面板保存后以 KV 的 app_config 为准。
[vars]
PROBE_MODE = "external-api"
CHECK_API = ""
CHECK_API_BACKUP = ""
CHECK_TIMEOUT = "15000"
SOCKET_PROBE_IPV4_URL = ""
SOCKET_PROBE_IPV6_URL = ""

# 每 3 小时检查一次；面板关闭 scheduledEnabled 时任务会直接跳过。
[triggers]
crons = ["0 */3 * * *"]
